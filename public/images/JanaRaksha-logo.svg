<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="maroonGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1E2A"/>
      <stop offset="100%" stop-color="#932A3B"/>
    </linearGradient>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6A94A"/>
      <stop offset="100%" stop-color="#F0C878"/>
    </linearGradient>
  </defs>

  <g transform="translate(30,30)">
    <!-- shield silhouette -->
    <path d="M70 0
             C100 14, 130 20, 140 22
             C140 80, 120 130, 70 160
             C20 130, 0 80, 0 22
             C10 20, 40 14, 70 0 Z"
          fill="url(#maroonGradIcon)"/>

    <!-- three people figures inside shield -->
    <g fill="#FFFFFF">
      <circle cx="70" cy="62" r="12"/>
      <path d="M50 118 C50 92, 58 80, 70 80 C82 80, 90 92, 90 118 Z"/>

      <circle cx="38" cy="72" r="9" opacity="0.9"/>
      <path d="M22 118 C22 98, 29 88, 38 88 C47 88, 54 98, 54 118 Z" opacity="0.9"/>

      <circle cx="102" cy="72" r="9" opacity="0.9"/>
      <path d="M86 118 C86 98, 93 88, 102 88 C111 88, 118 98, 118 118 Z" opacity="0.9"/>
    </g>

    <!-- protective arc -->
    <path d="M18 58 C18 25, 40 8, 70 8 C100 8, 122 25, 122 58"
          fill="none" stroke="url(#goldGradIcon)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>